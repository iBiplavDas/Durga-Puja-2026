name: analytics-report

# App usage (docs/product/ANALYTICS.md): pages, places, sounds and actions, from anonymous events, plus app
# errors in the last 24 h and the database / storage size. Aggregates only. The full directory is the "analytics" schema in the Supabase dashboard.
on:
  schedule:
    - cron: "40 16 * * *"          # 22:10 IST daily
  workflow_dispatch:
    inputs:
      days:
        description: "How many days to cover"
        default: "1"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build report
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python -m marketing.analytics --days "${{ inputs.days || '1' }}" --json analytics.json | tee -a "$GITHUB_STEP_SUMMARY"
      # App errors in the last 24 h (analytics.client_errors_daily) and database / storage size. Runs even if the
      # usage report failed, and never fails the job (e.g. before the client_errors migration is applied).
      - name: Errors and backend size
        if: always()
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python -m scripts.errors_report | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: analytics-report
          path: analytics.json
          retention-days: 14
